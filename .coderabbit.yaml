language: "ko-KR"

reviews:
  profile: "chill"
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "prisma/schema.prisma"
      instructions: |
        - docs/erd.md의 ERD와 모델, 컬럼, 관계(1:N, N:M)가 일치하는지 검증할 것.
        - 외래키 onDelete/onUpdate 정책, @unique, @@index 누락 여부를 확인할 것.
    - path: "src/**/*.js"
      instructions: |
        - 이 프로젝트는 Express + Prisma를 사용하며, TypeScript가 아닌 JavaScript(ESM)만 사용한다. TS 문법은 제안하지 말 것.
        - Prisma 모델/필드/관계명은 prisma/schema.prisma와 docs/erd.md 기준으로 검증할 것.
        - N+1 쿼리, include/select 남용, 불필요한 전체 조회를 지적할 것.
        - 여러 테이블을 변경하는 로직은 prisma.$transaction 사용 여부를 확인할 것.
        - $queryRawUnsafe 등 SQL 인젝션 위험을 지적할 것.
    - path: "src/**/*{route,router,controller}*.js"
      instructions: |
        - 요청 값(params, query, body) 검증 여부, 적절한 HTTP 상태 코드를 확인할 것.
        - async 핸들러의 에러가 에러 미들웨어로 전달되는지 확인할 것.
    - path: "src/**/*service*.js"
      instructions: |
        - 비즈니스 로직과 DB 접근이 분리되어 있는지, Prisma 에러(P2002, P2025 등) 처리를 확인할 것.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/erd.md"
